name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/deploy-pages.yml
  workflow_run:
    workflows: ["Release macOS & Windows builds"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy the exact commit whose release workflow succeeded, so the
          # website version and installer links match the published artifacts.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
