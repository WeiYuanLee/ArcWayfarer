name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/deploy-pages.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A published release deploys the website from its exact tag, so its
          # version and installer links match the installers users can download.
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
