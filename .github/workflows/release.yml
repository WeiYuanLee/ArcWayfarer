name: Release macOS & Windows builds

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14
            os: mac
            arch: arm64
          - runner: macos-13
            os: mac
            arch: x64
          - runner: windows-latest
            os: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set package version from release tag
        working-directory: frontend
        shell: bash
        run: |
          node -e 'const fs = require("fs"); const file = "package.json"; const pkg = JSON.parse(fs.readFileSync(file, "utf8")); pkg.version = process.env.GITHUB_REF_NAME.replace(/^v/, ""); fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);'

      - name: Build macOS ${{ matrix.arch }} dmg
        if: matrix.os == 'mac'
        run: bash scripts/build-mac.sh --arch ${{ matrix.arch }}

      - name: Build Windows exe
        if: matrix.os == 'win'
        run: powershell scripts/build-win.ps1

      - name: Upload macOS artifact
        if: matrix.os == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: package-mac-${{ matrix.arch }}
          path: frontend/release/*.dmg

      - name: Upload Windows artifact
        if: matrix.os == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: package-win-${{ matrix.arch }}
          path: frontend/release/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.exe
          body: |
            ## ArcWayfarer

            ArcWayfarer lets you precisely simulate and control an iPhone's GPS location from macOS or Windows. Teleport to any place, navigate along a route, and test location-aware experiences with ease.

            ## Downloads

            - **Windows** — Download the Windows `.exe` installer.
            - **macOS (Apple Silicon)** — Download the `.dmg` whose filename contains `arm64`.
            - **macOS (Intel)** — Download the `.dmg` whose filename contains `x64`.

            ---

            ## Before you install

            ### Windows
            1. Install **iTunes** (desktop or Microsoft Store) or Apple Mobile Device Support so Windows can detect your iPhone over USB.
            2. ArcWayfarer requests Administrator privileges at launch to support the iOS 17+ RemoteXPC tunnel.

            ### macOS — first launch
            This build is not signed with an Apple Developer certificate. If Gatekeeper blocks it, right-click ArcWayfarer in Applications, select **Open**, and confirm. You can also allow it in **System Settings → Privacy & Security**.
