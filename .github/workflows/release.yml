name: Release macOS & Windows builds

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14
            os: mac
            arch: arm64
          - runner: macos-15-intel
            os: mac
            arch: x64
          - runner: windows-latest
            os: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # iOS 18.2+ RemoteXPC tunneling uses TCP, which pymobiledevice3
          # supports only on Python 3.13+.
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set package version from release tag
        working-directory: frontend
        shell: bash
        run: |
          node -e 'const fs = require("fs"); const file = "package.json"; const pkg = JSON.parse(fs.readFileSync(file, "utf8")); pkg.version = process.env.GITHUB_REF_NAME.replace(/^v/, ""); fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);'

      - name: Build macOS ${{ matrix.arch }} dmg
        if: matrix.os == 'mac'
        env:
          ARCWAYFARER_VERIFY_BACKEND: "1"
        run: bash scripts/build-mac.sh --arch ${{ matrix.arch }}

      - name: Build Windows exe
        if: matrix.os == 'win'
        run: powershell scripts/build-win.ps1

      - name: Upload macOS artifact
        if: matrix.os == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: package-mac-${{ matrix.arch }}
          path: frontend/release/*.dmg

      - name: Upload Windows artifact
        if: matrix.os == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: package-win-${{ matrix.arch }}
          path: frontend/release/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - name: Require release notes for this version
        run: |
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "Release notes are required: $NOTES_FILE" >&2
            exit 1
          fi

      - name: Build release notes
        run: |
          cat "docs/releases/${GITHUB_REF_NAME}.md" > release-notes.md
          cat >> release-notes.md <<'EOF'

            ---

            ## ArcWayfarer

            ArcWayfarer 是一款專為 iPhone 設計的 GPS 位置模擬工具，讓你能在 macOS 或 Windows 上精準設定與控制 iPhone 的定位位置。無論是瞬間切換地點、依路線移動，或進行位置相關測試，都能自由、直覺地完成。

            ## 下載

            - **Windows** — 下載 Windows `.exe` 安裝程式。
            - **macOS（Apple Silicon）** — 下載檔名包含 `arm64` 的 `.dmg`。
            - **macOS（Intel）** — 下載檔名包含 `x64` 的 `.dmg`。

            ---

            ## 安裝前須知

            ### Windows
            1. 請安裝 **iTunes**（桌面版或 Microsoft Store 版）或 Apple Mobile Device Support，讓 Windows 能透過 USB 辨識你的 iPhone。
            2. ArcWayfarer 啟動時會要求系統管理員權限，以支援 iOS 17+ 的 RemoteXPC tunnel。

            ### macOS — 首次開啟
            此版本尚未使用 Apple Developer 憑證簽署。若 Gatekeeper 阻擋開啟，請在「應用程式」中對 ArcWayfarer **按右鍵 → 開啟**，再確認開啟；也可前往「系統設定 → 隱私權與安全性」允許開啟。

            ---

            ## English

            ArcWayfarer lets you precisely simulate and control an iPhone's GPS location from macOS or Windows. Teleport to any place, navigate along a route, and test location-aware experiences with ease.

            ## Downloads

            - **Windows** — Download the Windows `.exe` installer.
            - **macOS (Apple Silicon)** — Download the `.dmg` whose filename contains `arm64`.
            - **macOS (Intel)** — Download the `.dmg` whose filename contains `x64`.

            ---

            ## Before you install

            ### Windows
            1. Install **iTunes** (desktop or Microsoft Store) or Apple Mobile Device Support so Windows can detect your iPhone over USB.
            2. ArcWayfarer requests Administrator privileges at launch to support the iOS 17+ RemoteXPC tunnel.

            ### macOS — first launch
            This build is not signed with an Apple Developer certificate. If Gatekeeper blocks it, right-click ArcWayfarer in Applications, select **Open**, and confirm. You can also allow it in **System Settings → Privacy & Security**.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.exe
          body_path: release-notes.md
