<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400">
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="760" height="400" fill="#eaf7ff"/>
  <circle cx="690" cy="-30" r="175" fill="#3c8cff" opacity="0.06"/>
  <circle cx="75" cy="410" r="150" fill="#08cddb" opacity="0.07"/>

  <text x="380" y="51" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif"
        font-size="24" font-weight="700" fill="#14243c">
    Step 1：將 ArcWayfarer 拖曳到 Applications
  </text>

  <g aria-label="drag arrow">
    <circle cx="329" cy="164" r="3.5" fill="#58718d"/>
    <path d="M337 164 H421" fill="none" stroke="#58718d" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M421 154 L440 164 L421 174 Z" fill="#259bea"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="38" y="270" width="684" height="96" rx="16" fill="#ffffff" fill-opacity="0.82"/>
  </g>
  <rect x="38" y="270" width="5" height="96" rx="2.5" fill="#12b9da"/>

  <text x="65" y="306"
        font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif"
        font-size="17" font-weight="700" fill="#14243c">
    Step 2：首次開啟若 macOS 顯示「無法驗證開發者」
  </text>
  <text x="65" y="340"
        font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif"
        font-size="14" font-weight="500" fill="#3d516b">
    請在「應用程式」中按住 Control 鍵並點一下 ArcWayfarer，選擇「打開」，再按一次「打開」。
  </text>
</svg>
